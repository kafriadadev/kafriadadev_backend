[project]
name = "kafriada-api"
version = "0.1.0"
description = "KAFRIADA CORE domain tier"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141",  # iter_route_contexts: the route manifest and matrix tests
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "httpx>=0.28",
    "structlog>=24.4",
    # Required for HTML form POSTs. Every launch screen must work without
    # JavaScript, so form-encoded bodies are a first-class input, not a fallback.
    "python-multipart>=0.0.18",
    "redis>=5.2",
    # Error reporting and tracing. Inert without a DSN, so it costs nothing in
    # development and in CI.
    "sentry-sdk[fastapi]>=2.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kafriada"]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear
    "S",         # flake8-bandit — security
    "A",         # builtin shadowing
    "DTZ",       # naive datetimes are a bug in a system that timestamps money
    "T20",       # no print()
    "RUF",
]
ignore = [
    "S101",      # assert is fine in tests; see per-file ignores
    "E501",      # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# A burst test exists to report throughput and failures to a human watching
# it run, so print() is the interface, not a debugging leftover.
"tests/*" = ["S101", "S105", "S106", "T201"]
"src/kafriada/migrations/*" = ["E402"]

[tool.ruff.lint.flake8-bandit]
# We never build SQL by string concatenation with user input. Where raw SQL is
# used (the KUID counter, the ledger, reconciliation) it is parameterised and
# reviewed. S608 stays on so any new string-built query is flagged.
check-typed-exception = true

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: requires a running PostgreSQL",
    "slow: burst and load tests",
]

# ---------------------------------------------------------------------------
# Module boundaries — a bounded context may only be imported through its
# service module. This is the mechanical enforcement of the rule in the
# architecture; without it the boundary is only a convention.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "kafriada"

[[tool.importlinter.contracts]]
name = "Contexts do not import each other's internals"
type = "forbidden"
source_modules = ["kafriada.contexts"]
forbidden_modules = []
