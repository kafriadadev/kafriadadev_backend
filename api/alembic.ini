[alembic]
script_location = src/kafriada/migrations
prepend_sys_path = src
# Migration filenames sort chronologically and read as a changelog.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# sqlalchemy.url is deliberately absent. It comes from DATABASE_URL_MIGRATE at
# runtime so a database credential is never written into a tracked file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
