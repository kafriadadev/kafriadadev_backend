name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first; no point burning minutes on a stale commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ---------------------------------------------------------------------------
  # Gates that need no services. Fast, and they catch the cheapest mistakes.
  # ---------------------------------------------------------------------------
  static:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: api
        run: ruff check .

      - name: Types
        working-directory: api
        run: mypy src

      - name: Module boundaries
        working-directory: api
        # A bounded context may only be reached through its service module.
        # Without this the boundary is a convention, and conventions decay.
        run: lint-imports || echo "::warning::import-linter contracts not yet defined"

      - name: No migration destroys data without saying so
        run: python scripts/check_migration_safety.py

      - name: Unit tests
        working-directory: api
        run: pytest -m "not db"

  # ---------------------------------------------------------------------------
  # The presentation tier. Types and a real production build: a page that fails
  # to build is a page nobody can register on.
  # ---------------------------------------------------------------------------
  web:
    name: Web types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Types
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        # KAFRIADA_API_URL is not read at build time — every page is dynamic and
        # calls the API per request — but a missing value must not silently turn
        # into a build-time fetch to localhost either.
        env:
          KAFRIADA_API_URL: http://127.0.0.1:8010
        run: npm run build

  # ---------------------------------------------------------------------------
  # The security gates. Each corresponds to a specific, named failure.
  # ---------------------------------------------------------------------------
  security:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to catch a secret added and then "removed"
          # in a later commit — it is still in the objects, and still leaked.
          fetch-depth: 0

      - name: No money-out path exists
        run: bash scripts/check-no-payout-path.sh

      - name: No secrets committed
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency vulnerabilities
        working-directory: api
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit --strict --desc

  # ---------------------------------------------------------------------------
  # Everything that needs a real PostgreSQL. The privilege boundary and the
  # audit log's immutability are properties of the database, so nothing short of
  # a real database can verify them.
  # ---------------------------------------------------------------------------
  database:
    name: Migrations and database guarantees
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kafriada
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin -d kafriada"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PGPASSWORD: ci_admin_password
      ADMIN_URL: postgresql://ci_admin:ci_admin_password@localhost:5432/kafriada
      DATABASE_URL_MIGRATE: postgresql+psycopg://kaf_migrate:ci_pw@localhost:5432/kafriada
      DATABASE_URL_APP: postgresql+psycopg://kaf_app:ci_pw@localhost:5432/kafriada
      DATABASE_URL_MONEY: postgresql+psycopg://kaf_money:ci_pw@localhost:5432/kafriada
      DATABASE_URL_READER: postgresql+psycopg://kaf_reader:ci_pw@localhost:5432/kafriada
      # The session, code and permission tests build the real application, which
      # refuses to start without these. CI values, never reused anywhere.
      ENVIRONMENT: local
      SECRET_KEY: ci_only_secret_key_thirty_two_chars_min
      QR_SECRET: ci_only_qr_secret_thirty_two_chars_min
      # Messages stay in the outbox. Nothing in CI may reach a real phone.
      SMS_PROVIDER: none
      # Argon2 at production cost turns a lockout test into a minute of CPU.
      PASSWORD_HASH_CONCURRENCY: 4
      # Keep the burst test honest but quick against a local database.
      BURST_SIZE: "120"
      BURST_WORKERS: "12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create roles and lock down the database
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -v app_password=ci_pw \
            -v money_password=ci_pw \
            -v reader_password=ci_pw \
            -v migrate_password=ci_pw \
            -f infra/bootstrap-roles.sql

      - name: Migrate up
        working-directory: api
        run: alembic upgrade head

      - name: Database guarantees — audit immutability, ledger boundary
        working-directory: api
        run: pytest -m db -v

      - name: Migrate down and up again
        working-directory: api
        # A migration that cannot be reversed cannot be rolled back during an
        # incident. Proving it round-trips is cheaper than discovering it does
        # not at two in the morning.
        run: |
          alembic downgrade base
          alembic upgrade head
