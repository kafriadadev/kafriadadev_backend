# Local development only. Nothing here is a production topology.
#
# Every service binds to 127.0.0.1 rather than 0.0.0.0. On a laptop that joins
# cafe and airport networks, a database listening on all interfaces with a weak
# development password is a genuine exposure, not a theoretical one.

name: kafriada

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: kafriada
      POSTGRES_USER: kafriada_admin
      POSTGRES_PASSWORD: local_dev_only_not_a_real_secret
      # Deliberately scrypt rather than the older md5 default.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    command:
      - postgres
      # Log every statement that holds a lock longer than this. The KUID counter
      # is a single hot row; lock waits are the first thing to look at when
      # registration slows down.
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "deadlock_timeout=200ms"
      # Surface slow queries in development, where there is time to fix them.
      - "-c"
      - "log_min_duration_statement=200"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafriada_admin -d kafriada"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # No persistence. Redis holds rate-limit counters and the idempotency cache,
    # both of which are safe to lose — durable work lives in the PostgreSQL
    # outbox. Making that explicit here stops anyone later assuming otherwise.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for Cloudflare R2. Same S3 API, same presigned upload and download
  # flow, so the media path is exercised locally exactly as it runs in production.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: kafriada_local
      MINIO_ROOT_PASSWORD: local_dev_only_not_a_real_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches outbound email so nothing can reach a real address from a laptop.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
  minio-data:
